; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 chi co 1 cong USB native (USB-Serial/JTAG, khong co CP2102/CH340).
; Bat USB CDC on boot de `Serial` map toi USB native (HWCDC) thay vi UART0
; (GPIO43/44 khong noi dau ca tren bo nay).
; - ARDUINO_USB_MODE=1 da co san trong board JSON (esp32-s3-devkitc-1.json).
; - Platform 6.12.0 khong doc key board_build.arduino.cdc_on_boot,
;   nen dung build_flags truc tiep (same macro).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306

; I2C scanner doc lap: chi build src/i2c_scanner.cpp (guard #ifdef I2C_SCANNER,
; Wire core), KHONG keo main.cpp / OLED code / Adafruit SSD1306.
; (src_dir per-env bi PIO builder bo qua - builder chi doc src_dir o [platformio],
;  nen dung build_src_filter tren src/ thay vi src_dir scanner/)
[env:esp32-s3-scan]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2C_SCANNER
build_src_filter =
    +<*i2c_scanner.cpp>

