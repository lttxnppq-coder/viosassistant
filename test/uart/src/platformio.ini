; PlatformIO Project Configuration File
;
; UART test - 2x ESP32 DOIT DEVKIT V1
; ----------------------------------------------------------
; - env node1: build ONLY src/node1.cpp -> ESP32 #1 (TRANSMITTER)
; - env node2: build ONLY src/node2.cpp -> ESP32 #2 (RECEIVER)
;
; Build cả 2:        pio run
; Upload ESP32 #1:   pio run -e node1 -t upload
; Upload ESP32 #2:   pio run -e node2 -t upload
; Monitor ESP32 #1:  pio device monitor -e node1
; Monitor ESP32 #2:  pio device monitor -e node2

[env:node1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<node1.cpp>

[env:node2]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<node2.cpp>
